name: Collection Autopilot

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (Skip Push/Publish)'
        required: true
        type: boolean
        default: false
      force_publish:
        description: 'Force Publish (Ignore "Already up to date")'
        required: false
        type: boolean
        default: false

concurrency:
  group: collection-autopilot
  cancel-in-progress: false

jobs:
  maintain-fork:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write # Required for pruning old runs
    steps:
      - name: Checkout Fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          token: ${{ secrets.SYNC_PAT }}
          fetch-depth: 0

      - name: Sync with Upstream
        id: sync
        run: |
          git remote add upstream https://github.com/k3s-io/k3s-ansible.git
          git fetch --no-tags upstream main:refs/remotes/upstream/main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BEFORE_SHA=$(git rev-parse HEAD)
          
          # Attempt merge. If it fails (likely due to galaxy.yml), 
          # we specifically checkout the upstream version of galaxy.yml to clear the markers.
          if ! git merge upstream/main --no-edit; then
            echo "Merge conflict detected in metadata. Resolving using upstream source..."
            git checkout upstream/main -- galaxy.yml
            git add galaxy.yml
            # No need to commit yet; the Python script will modify it further.
          fi

          UNMERGED_FILES=$(git diff --name-only --diff-filter=U)
          if [[ -n "$UNMERGED_FILES" ]]; then
            echo "Unresolved merge conflicts remain:"
            echo "$UNMERGED_FILES"
            exit 1
          fi
          
          if [[ "$(git rev-parse HEAD)" != "$BEFORE_SHA" ]] || ! git diff --quiet HEAD || ! git diff --cached --quiet || [[ "${{ inputs.force_publish }}" == "true" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$(git rev-parse HEAD)" != "$BEFORE_SHA" ]] || ! git diff --quiet HEAD || ! git diff --cached --quiet; then
            echo "upstream_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "upstream_changed=false" >> "$GITHUB_OUTPUT"
          fi
          
      - name: Install Ansible Core
        if: (steps.sync.outputs.changed == 'true' || inputs.force_publish == true)
        run: python -m pip install --disable-pip-version-check ansible-core==2.20.5

      - name: Process and Semantic Version
        if: (steps.sync.outputs.changed == 'true' || inputs.force_publish == true)
        id: process
        shell: python
        run: |
          import os, yaml, subprocess, re, datetime

          def run_git(args):
              return subprocess.check_output(['git'] + args).decode().strip()

          def semver_tags():
              try:
                  tags = run_git(['tag', '--list', '--sort=-v:refname']).splitlines()
              except Exception:
                  return []
              return [tag for tag in tags if re.fullmatch(r'v?\d+\.\d+\.\d+', tag)]

          def normalize_version(version):
              return re.sub(r'^v', '', version)

          force_publish = '${{ inputs.force_publish }}' == 'true'
          upstream_changed = '${{ steps.sync.outputs.upstream_changed }}' == 'true'
          head_tags = [
              tag for tag in run_git(['tag', '--points-at', 'HEAD']).splitlines()
              if re.fullmatch(r'v?\d+\.\d+\.\d+', tag)
          ]
          retry_existing_release = force_publish and not upstream_changed and bool(head_tags)

          # 1. Get the Current Version (Source of Truth = Git Tags)
          tags = semver_tags()
          if tags:
              current_ver_str = normalize_version(tags[0])
              print(f"Found latest fork release tag: {current_ver_str}")
          else:
              print("No tags found. Falling back to galaxy.yml or 0.0.0")
              with open('galaxy.yml', 'r') as f:
                  current_ver_str = yaml.safe_load(f).get('version', '0.0.0')

          # Parse version
          try:
              major, minor, patch = map(int, current_ver_str.split('.'))
          except ValueError:
              major, minor, patch = 0, 0, 0

          if retry_existing_release:
              new_ver = normalize_version(sorted(head_tags, key=normalize_version)[-1])
              bump = "retry"
              logs = ""
              print(f"Retrying existing release at HEAD: {new_ver}")
          else:
              # 2. Determine Bump based on Commits since last fork release tag
              try:
                  last_tag = tags[0]
                  logs = run_git(['log', f'{last_tag}..HEAD', '--oneline']).lower()
              except Exception:
                  logs = run_git(['log', '--oneline']).lower()

              bump = "patch"
              if any(x in logs for x in ["breaking change", "!:", "feat!:"]):
                  bump = "major"
              elif "feat:" in logs:
                  bump = "minor"

              # 3. Calculate New Version
              if bump == "major":
                  new_ver = f"{major + 1}.0.0"
              elif bump == "minor":
                  new_ver = f"{major}.{minor + 1}.0"
              else:
                  new_ver = f"{major}.{minor}.{patch + 1}"
          
          print(f"Bump type: {bump} | New Version: {new_ver}")

          # 4. Update galaxy.yml Data
          with open('galaxy.yml', 'r') as f:
              docs = list(yaml.safe_load_all(f))
              galaxy_data = docs[0] if docs else {}

          galaxy_data.update({
              'version': new_ver,
              'namespace': 'mattykay',
              'name': 'k3s_ansible',
              'homepage': 'https://github.com/mattykay/k3s-ansible',
              'repository': 'https://github.com/mattykay/k3s-ansible',
              'authors': ['Matthew Kalnins <github@mattykay.com>', 'k3s-io community']
          })

          if not retry_existing_release:
              # 5. Update CHANGELOG_FORK.md
              today = datetime.date.today().isoformat()
              
              try:
                  last_tag = tags[0]
                  # Format: * [hash](commit url) - message (date)
                  changelog_raw = run_git(['log', f'{last_tag}..HEAD', '--pretty=format:* [%h](https://github.com/mattykay/k3s-ansible/commit/%H) - %s (%ad)', '--date=short'])
              except Exception:
                  changelog_raw = run_git(['log', '--pretty=format:* [%h](https://github.com/mattykay/k3s-ansible/commit/%H) - %s (%ad)', '--date=short'])

              if not changelog_raw.strip():
                  changelog_raw = "* No code changes (administrative release or forced push)."

              new_changelog_entry = f"## [{new_ver}] - {today}\n\n{changelog_raw}\n\n"

              changelog_file = 'CHANGELOG_FORK.md'
              header = "# Changelog (Fork)\n\n"
              existing_content = ""
              
              if os.path.exists(changelog_file):
                  with open(changelog_file, 'r') as f:
                      # Strip the header if it exists so we don't duplicate it
                      existing_content = f.read().replace(header, "")

              with open(changelog_file, 'w') as f:
                  f.write(header + new_changelog_entry + existing_content)
              
              print(f"Updated {changelog_file} for version {new_ver}")

          # 6. Ensure Role Metadata (The "Galaxy Structure Fix")
          roles_path = 'roles'
          if os.path.exists(roles_path):
              for role in os.listdir(roles_path):
                  role_dir = os.path.join(roles_path, role)
                  if os.path.isdir(role_dir):
                      # README.md
                      if not os.path.exists(os.path.join(role_dir, 'README.md')):
                          with open(os.path.join(role_dir, 'README.md'), 'w') as f:
                              f.write(f"# {role}\nRole for k3s cluster deployment.")
                      # meta/main.yml
                      meta_dir = os.path.join(role_dir, 'meta')
                      os.makedirs(meta_dir, exist_ok=True)
                      if not os.path.exists(os.path.join(meta_dir, 'main.yml')):
                          with open(os.path.join(meta_dir, 'main.yml'), 'w') as f:
                              f.write("galaxy_info:\n  author: mattykay\n  description: k3s role\n  license: Apache-2.0")

          # 7. Write files
          with open('galaxy.yml', 'w') as f:
              yaml.dump(galaxy_data, f, default_flow_style=False, explicit_start=True)

          separator = "# UPSTREAM DOCUMENTATION"
          fork_header = ""
          if os.path.exists('README_FORK.md'):
              with open('README_FORK.md', 'r') as f:
                  fork_header = f.read().strip()
          
          with open('README.md', 'r') as f:
              content = f.read()
              upstream = content.split(separator)[-1].strip() if separator in content else content.strip()

          with open('README.md', 'w') as f:
              f.write(f"{fork_header}\n\n")
              f.write(f"**Current Version:** `{new_ver}` | [Full Changelog](./CHANGELOG_FORK.md)\n")
              f.write(f"\n---\n{separator}\n{upstream}")

          # 8. Set Outputs
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"new_tag={new_ver}\n")
              out.write(f"bump_type={bump}\n") 

      - name: Validate Collection Build
        if: (steps.sync.outputs.changed == 'true' || inputs.force_publish == true)
        run: ansible-galaxy collection build --force

      - name: Commit and Tag
        if: steps.sync.outputs.changed == 'true' && inputs.dry_run == false
        run: |
          git add galaxy.yml README.md CHANGELOG_FORK.md roles
          if git diff --cached --quiet; then
            echo "No release commit changes to create."
          else
            git commit -m "chore: release ${{ steps.process.outputs.new_tag }} [skip ci]"
          fi
          
          TAG="${{ steps.process.outputs.new_tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            if [[ "$(git rev-parse "$TAG")" != "$(git rev-parse HEAD)" ]]; then
              echo "Tag $TAG already exists but does not point at HEAD."
              exit 1
            fi
            echo "Tag $TAG already exists at HEAD."
          else
            git tag "$TAG"
          fi
          
          # Push the branch (main)
          git push origin main
          
          # Push ONLY the specific new tag to avoid touching old workflow-linked tags
          if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Remote tag $TAG already exists."
          else
            git push origin "refs/tags/$TAG"
          fi

      - name: GitHub Release & Galaxy Publish
        if: steps.sync.outputs.changed == 'true' && inputs.dry_run == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: |
          TAG="${{ steps.process.outputs.new_tag }}"
          ARTIFACT=$(find . -maxdepth 1 -name "mattykay-k3s_ansible-${TAG}.tar.gz" -print -quit)
          if [[ -z "$ARTIFACT" ]]; then
            echo "Could not find collection artifact for $TAG."
            exit 1
          fi

          # Force the release to your fork specifically
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists."
          else
            gh release create "$TAG" \
              --repo ${{ github.repository }} \
              --target main \
              --title "Release $TAG" \
              --generate-notes
          fi
          
          # Publish to Galaxy
          if ansible-galaxy collection install "mattykay.k3s_ansible:$TAG" --force -p /tmp/galaxy-publish-check >/dev/null 2>&1; then
            echo "Galaxy collection mattykay.k3s_ansible:$TAG already exists."
          else
            ansible-galaxy collection publish "$ARTIFACT" --api-key "$GALAXY_API_KEY"
          fi

      - name: Prune Old Workflow Runs
        if: always()
        run: |
          gh run list --workflow "${{ github.workflow }}" --limit 100 --json databaseId -q '.[20:].databaseId' | xargs -r -I{} gh run delete {} || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Discord Failure Alert
        if: failure() && github.event_name != 'workflow_dispatch'
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "embeds": [{
              "title": "Collection Autopilot Failed",
              "description": "The automated sync or publish process encountered an error.",
              "color": 15158332,
              "fields": [
                { "name": "Repository", "value": "${{ github.repository }}", "inline": true },
                { "name": "Workflow", "value": "${{ github.workflow }}", "inline": true },
                { "name": "Run ID", "value": "${{ github.run_id }}", "inline": true },
                { "name": "Bump Type", "value": "${{ steps.process.outputs.bump_type }}", "inline": true }
              ],
              "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "footer": { "text": "GitHub Actions Auto-Monitor" },
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }]
          }
          EOF
          )

          curl -X POST -H 'Content-Type: application/json' \
          -d "$PAYLOAD" \
          ${{ secrets.NOTIFY_WEBHOOK_URL }}
